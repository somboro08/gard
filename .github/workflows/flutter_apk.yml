name: CI — Builder l'APK

on:
  push:
    branches: [main]
    paths-ignore: ['server/**', '.github/workflows/server.yml']
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-apk:
    name: Analyze, test and build APK debug
    runs-on: ubuntu-latest
    steps:
      - name: Checkout du code
        uses: actions/checkout@v4

      - name: Installer Java (JDK 17)
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Installer Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable

      - name: Cache des packages Pub
        uses: actions/cache@v4
        with:
          path: ~/.pub-cache
          key: ${{ runner.os }}-pub-${{ hashFiles('pubspec.yaml') }}
          restore-keys: |
            ${{ runner.os }}-pub-

      # Le projet ne versionne pas android/. On génère le squelette Android
      # sans perdre les sources GARD ni sa configuration Pub.
      - name: Sauvegarder les sources GARD
        run: |
          mkdir -p /tmp/garde-backup
          mv pubspec.yaml /tmp/garde-backup/pubspec.yaml
          mv lib /tmp/garde-backup/lib
          mv test /tmp/garde-backup/test

      - name: Générer le projet Android
        run: flutter create --platforms=android --project-name garde --org bj.mrl .

      # flutter create crée ses propres lib/ et test/. Il faut les supprimer
      # avant de restaurer les dossiers d'origine, sinon mv les imbrique.
      - name: Restaurer les sources GARD
        run: |
          rm -rf lib test
          mv /tmp/garde-backup/pubspec.yaml pubspec.yaml
          mv /tmp/garde-backup/lib lib
          mv /tmp/garde-backup/test test

      - name: Configurer les plateformes
        run: dart run tool/setup_platforms.dart

      - name: Récupérer les dépendances
        run: flutter pub get

      - name: Accepter les licences Android SDK
        run: yes | flutter doctor --android-licenses

      - name: Analyser le code Dart
        run: flutter analyze --no-fatal-infos

      - name: Exécuter les tests
        run: flutter test --reporter expanded

      - name: Construire l'APK debug
        run: flutter build apk --debug

      - name: Déposer l'APK en artefact
        uses: actions/upload-artifact@v4
        with:
          name: garde-apk-debug
          path: build/app/outputs/flutter-apk/app-debug.apk
          retention-days: 30
