name: CI — Builder l'APK

on:
  push:
    branches: [main]
  workflow_dispatch:  # lancement manuel depuis l'onglet Actions

env:
  FLUTTER_CHANNEL: stable

jobs:
  build-apk:
    name: Build APK debug
    runs-on: ubuntu-latest
    steps:
      - name: Checkout du code
        uses: actions/checkout@v4

      - name: Installer Java (JDK 17, requis par Flutter/Android)
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Installer Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable

      - name: Cache des packages pub
        uses: actions/cache@v4
        with:
          path: |
            ~/.pub-cache
          key: ${{ runner.os }}-pub-${{ hashFiles('pubspec.yaml') }}
          restore-keys: |
            ${{ runner.os }}-pub-

      # android/ n'est pas dans le dépôt : il est régénéré à chaque build.
      # On met pubspec.yaml, lib/ et test/ à l'abri au cas où flutter create
      # les écrase, puis on les restaure.
      - name: Mettre pubspec/lib/test à l'abri pendant flutter create
        run: |
          mkdir -p /tmp/garde-backup
          mv pubspec.yaml /tmp/garde-backup/pubspec.yaml
          mv lib /tmp/garde-backup/lib
          mv test /tmp/garde-backup/test

      - name: Générer android/ (flutter create)
        run: flutter create --platforms=android --project-name garde --org bj.mrl .

      - name: Restaurer pubspec.yaml, lib/ et test/
        run: |
          mv /tmp/garde-backup/pubspec.yaml pubspec.yaml
          mv /tmp/garde-backup/lib lib
          mv /tmp/garde-backup/test test

      - name: Configurer les fichiers plateforme (caméra, minSdk 24, etc.)
        run: dart run tool/setup_platforms.dart

      - name: Récupérer les dépendances
        run: flutter pub get

      - name: Accepter les licences Android SDK
        run: yes | flutter doctor --android-licenses

      - name: Analyser le code
        run: flutter analyze
        continue-on-error: true

      - name: Exécuter les tests
        run: flutter test
        continue-on-error: true

      - name: Construire l'APK debug
        run: flutter build apk

      - name: Déposer l'APK en artefact
        uses: actions/upload-artifact@v4
        with:
          name: garde-apk-debug
          path: build/app/outputs/flutter-apk/app-debug.apk
          retention-days: 30
          overwrite: true
