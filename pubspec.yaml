name: garde
description: "Garde — gestion et sécurisation de parkings à motos et vélos (MVP)."
publish_to: "none"
version: 1.0.0+1

environment:
  sdk: ^3.6.0

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter

  # Navigation (transitions personnalisées + shell à 2 onglets)
  go_router: ^14.8.1

  # Base locale (SQLite). Passage à PostgreSQL : voir README (interface ParkingRepository).
  sqflite: ^2.4.1
  path: ^1.9.0

  # Icônes Iconsax
  iconsax_flutter: ^1.0.0

  # Scan QR (ticket) / caméra + OCR (plaque) / QR affiché / liens externes (WhatsApp, appel)
  mobile_scanner: ^6.0.0
  camera: ^0.11.0
  google_mlkit_text_recognition: ">=0.13.1 <1.0.0"
  qr_flutter: ^4.1.0
  url_launcher: ^6.3.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0

flutter:
  uses-material-design: true
